<style>

.pink{background:var(--pink)}.yel{background:var(--yel);color:#fff}.lime{background:var(--lime);color:var(--ink)}.org{background:var(--org);color:#fff}.blue{background:var(--blue)}.wh{background:var(--wh);color:var(--ink)}

.vid{background:var(--ink);padding:28px clamp(16px,5vw,64px);border-bottom:6px solid var(--yel)}.vidbox{background:var(--pink);border-radius:20px;padding:28px;max-width:900px}

.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:14px;margin:8px 0;font-weight:600}.opt.sel{background:var(--yel);color:#fff}.opt.ok{background:var(--lime)}.opt.no{background:#ffb3b3}

.err{color:#b00020;font-weight:700}.ok2{color:#0a7a2f;font-weight:700}
.big{font-size:clamp(70px,18vw,220px);font-weight:900;line-height:.85;letter-spacing:-.05em}

.ctl{display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--ink)}.ctl .prog{flex:1;margin:0}.ctl .prog i{background:#fff4}.ctl .prog i.on{background:var(--lime)}

.tabs{display:flex;gap:8px;flex-wrap:wrap}details{background:#0002;border-radius:12px;padding:12px;margin:8px 0}summary{font-weight:800;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--lime);color:var(--ink);font-weight:800;padding:10px 18px;border-radius:99px;z-index:60}
#intro{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#intro .ring{position:absolute;border-radius:50%;border:6px solid;animation:ex 2.6s ease-out forwards;opacity:0}

#intro .wm{position:absolute;bottom:12%;font-weight:900;font-size:28px;opacity:0;animation:pop .5s 2.1s forwards}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{padding:30px;text-align:center;opacity:.6;font-size:13px}

.hero{padding:clamp(48px,8vw,112px) clamp(20px,5vw,72px);min-height:0}
.hc{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,72px);align-items:center;max-width:1300px;margin:0 auto}
.ht{min-width:0}.ht h1{font-size:clamp(42px,7vw,108px);line-height:.92;margin:14px 0 24px;overflow-wrap:break-word}
.ht p{margin:0 0 28px;font-size:clamp(17px,2vw,22px);max-width:480px}.hb{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}.hb .btn{margin:0}
.hv{position:relative;display:flex;justify-content:center;align-items:center;min-width:0}

#intro svg{animation:spin 1s linear infinite,fi .6s ease-out}@keyframes fi{from{opacity:0}}

.hero{background:var(--ink)}
:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px #101014}
.dk{background:var(--ink);color:var(--wh)}.dk .err{color:#ff8fa3}.dk .chip.on{background:var(--yel);border-color:var(--yel);color:#fff}.dk .stats div{background:#ffffff14}.dk .ck{background:#ffffff14;border-color:#fff3}
a.btn{display:inline-block;text-decoration:none}.dk section{padding:0}.dk h2{margin-top:36px}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));grid-auto-flow:dense;gap:36px 24px;align-items:start}

.vc:hover .disc svg,.vc:focus-visible .disc svg{transform:scale(1.06) rotate(18deg)}.vc small{display:block;opacity:.75;margin-top:4px;font-size:13px}
.ft{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0}.ft button{text-align:left;background:#ffffff14;border:2px solid #fff3;border-radius:18px;padding:16px;color:inherit}.ft button.on{border-color:var(--yel);background:#7650E844}
.bar{height:8px;background:#fff3;border-radius:9px;margin:8px 0 4px;max-width:360px}.bar i{display:block;height:100%;background:var(--yel);border-radius:9px}.st{font-size:12px;font-weight:700;opacity:.85}
.gate{padding:14px;border:2px dashed #fff5;border-radius:14px}
@media(max-width:640px){.vg{grid-template-columns:repeat(2,1fr);gap:28px 14px}.vc.lg{grid-row:span 1}}

body{line-height:1.55}p,li{line-height:1.6}li{margin:4px 0}
h1{line-height:.98;letter-spacing:-.035em}h2{line-height:1.05;letter-spacing:-.03em;margin-bottom:6px}h3{line-height:1.2}h1,h2,h3{overflow-wrap:break-word}

:where(section,.wrap,.ck,.story)>*+*:not(button,a,span,label,.tag,.btn,br,input,select,.chip){margin-top:14px}

.vc{display:block;width:100%;min-width:0;letter-spacing:normal;font-size:16px;line-height:1.4}.vc.lg{grid-row:auto}.vc.lg .disc{max-width:520px}.vc h3{text-transform:none}

.url{display:block;margin-top:6px;font-size:12px;opacity:.8;word-break:break-all}.toast{max-width:90vw;text-align:center;word-break:break-all}
#intro .ir{position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;border-style:solid;opacity:0;transform:translate(-50%,-50%);animation:ex2 2.7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes ex2{0%{width:0;height:0;opacity:1}100%{width:150vmax;height:150vmax;opacity:0}}
#intro .vn{width:min(34vmin,220px);aspect-ratio:1;animation:vin 1.4s cubic-bezier(.2,.8,.2,1) both,vup .9s 2.3s cubic-bezier(.6,0,.3,1) forwards}
#intro .vn svg{width:100%;height:100%;animation:spin 3.6s linear infinite;filter:drop-shadow(0 12px 30px #000a)}
@keyframes vin{from{transform:rotate(-540deg) scale(.1);opacity:0}to{transform:none;opacity:1}}
@keyframes vup{to{transform:translateY(-22vh) scale(.55)}}
#intro .wd{position:absolute;font-weight:900;line-height:1;letter-spacing:-.03em;color:transparent;white-space:nowrap;opacity:0;animation:wd 1.5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wd{0%{opacity:0;transform:translateX(var(--x))}25%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateX(calc(var(--x) * -.3))}}
#intro .hd{position:absolute;left:0;right:0;top:54%;text-align:center;font-weight:900;font-size:clamp(34px,9.5vw,118px);letter-spacing:-.035em;line-height:1.02;padding:0 12px}
#intro .m{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .08em .1em}

#intro .wm2{position:absolute;bottom:9%;font-weight:900;font-size:clamp(20px,3vw,30px);letter-spacing:-.02em;opacity:0;animation:fi2 .6s 3.5s forwards}#intro .wm2 i{color:var(--pink);font-style:normal}
@keyframes fi2{to{opacity:1}}
#intro .wp{position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;background:var(--pink);transform:translate(-50%,-50%);animation:wp .9s cubic-bezier(.7,0,.3,1) 3.9s forwards}

#intro.rm .wd,#intro.rm .ir,#intro.rm .wp{display:none}#intro.rm .wr{transform:none}#intro.rm .wm2{opacity:1}#intro.rm .vn{transform:translateY(-22vh) scale(.55)}
.pink .btn.p{background:var(--ink);color:#fff}.lime .btn:not(.p):not(.o){background:var(--ink);color:var(--lime)}.yel .lbl{background:var(--ink)}.rec .sl{outline:3px solid #ffffff1f;outline-offset:-3px}
.sw{border:2px solid #fff4;border-radius:16px;padding:16px;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;font-weight:800}.sw small{font-weight:600;opacity:.8}

<script>
const R=[
{id:'earth',t:'What If Earth Stopped Spinning?',s:'Physics',c:'#3264FF',a:'#FF2D95',m:'8 min',d:'Earth turns at about 1,670 km/h at the equator. What would happen if that stopped?'},
{id:'time',t:'Why Does Time Slow Down?',s:'Physics',c:'#F5F1E8',a:'#7650E8',m:'3 min',d:'Clocks tick at different rates depending on speed and gravity.',o:'Einstein’s relativity says moving clocks and clocks deep in gravity run slower. The effect is tiny in daily life but has been measured many times.',f:'GPS satellite clocks need relativity corrections or positions would drift by kilometres each day|Astronauts on the ISS age very slightly less than people on the ground|Atomic clocks flown on aircraft have confirmed time dilation',k:'Time dilation|Special relativity|Gravitational time dilation',rel:'bh'},
{id:'bh',t:'What Would Happen Inside a Black Hole?',s:'Physics',c:'#101014',a:'#FF2D95',m:'4 min',d:'Beyond the event horizon, nothing can return, not even light.',o:'A black hole is a region where gravity is so strong that escaping would need faster-than-light speed. What happens at its centre is unknown because current physics breaks down there.',f:'Near a stellar-mass black hole, tidal forces would stretch you out (spaghettification)|The event horizon is a point of no return, not a solid surface|The first image of a black hole shadow was released in 2019',k:'Event horizon|Singularity|Tidal forces',rel:'time'},
{id:'moon',t:'Why Does the Moon Change Shape?',s:'Space',c:'#7650E8',a:'#3264FF',m:'3 min',d:'The Moon never changes shape. Our view of its sunlit half does.',o:'As the Moon orbits Earth, we see different portions of its sunlit side. That cycle creates the phases.',f:'The cycle of phases takes about 29.5 days|The same side of the Moon always faces Earth|A new moon is when the near side is unlit',k:'Phases|Orbit|Tidal locking',rel:'sat'},
{id:'mars',t:'Could Humans Live on Mars?',s:'Space',c:'#7650E8',a:'#C7F464',m:'4 min',d:'Radiation, thin air and cold are just the start of the challenge.',o:'Mars has water ice and a day length similar to ours, but no breathable air, little protection from radiation and very low temperatures. Any base would need life-support for everything.',f:'Mars’s atmosphere is about 95% carbon dioxide and very thin|A Martian day is about 24 hours 37 minutes|Gravity there is about 38% of Earth’s',k:'Radiation|Atmosphere|Life support',rel:'moon'},
{id:'sat',t:'How Do Satellites Stay in Orbit?',s:'Space',c:'#F5F1E8',a:'#3264FF',m:'3 min',d:'Satellites are always falling, sideways fast enough to keep missing Earth.',o:'Gravity pulls a satellite down while its sideways speed carries it forward. The two balance so it follows a curved path around the planet.',f:'The ISS travels about 28,000 km/h|It circles Earth roughly every 90 minutes|Geostationary satellites sit about 35,786 km up and match Earth’s rotation',k:'Orbital velocity|Gravity|Geostationary orbit',rel:'earth'},
{id:'dream',t:'Why Do We Dream?',s:'Biology',c:'#FF2D95',a:'#7650E8',m:'4 min',d:'Scientists still debate why we dream.',o:'Dreaming is strongest in REM sleep. Leading ideas link it to memory processing and emotion regulation, but none is settled.',f:'Most vivid dreams happen in REM sleep|Everyone dreams, even when they do not remember|Theories include memory consolidation and emotional processing',k:'REM sleep|Consolidation|Emotion processing',rel:'mem'},
{id:'mem',t:'How Does the Brain Create Memories?',s:'Neuroscience',c:'#C7F464',a:'#3264FF',m:'4 min',d:'Memories are patterns of connected neurons, strengthened by repetition.',o:'Experiences are encoded by networks of neurons. Connections between them strengthen with repetition and sleep, which is how short-term experience becomes lasting memory.',f:'The hippocampus is central to forming new long-term memories|Sleep helps consolidate what you learned|Recalling a memory can slightly change it',k:'Hippocampus|Synapses|Consolidation',rel:'dream'},
{id:'goose',t:'Why Do We Get Goosebumps?',s:'Biology',c:'#101014',a:'#3264FF',m:'2 min',d:'A leftover reflex from our furrier ancestors.',o:'Goosebumps happen when tiny muscles at the base of hairs contract. In furry animals this fluffs fur for warmth or to look bigger.',f:'The muscles are called arrector pili|Cold, fear and strong emotion can all trigger them|They are an involuntary reflex',k:'Reflex|Arrector pili|Thermoregulation',rel:'chills'},
{id:'love',t:'What Happens Inside Your Brain When You Fall in Love?',s:'Neuroscience',c:'#FF2D95',a:'#F5F1E8',m:'4 min',d:'Dopamine, oxytocin and a very busy reward system.',o:'Brain-imaging studies show reward-related regions become active when people look at someone they love. Chemicals like dopamine and oxytocin are involved, though the full picture is complex.',f:'Reward regions of the brain activate when viewing a loved one|Dopamine is linked to motivation and craving|Oxytocin is tied to bonding, but is not simply a love hormone',k:'Reward system|Dopamine|Attachment',rel:'chills'},
{id:'chills',t:'Why Does Music Give Us Chills?',s:'Neuroscience',c:'#C7F464',a:'#101014',m:'3 min',d:'A sudden swell can trigger a real physical reaction.',o:'Some people feel shivers when music surprises them. Research links these chills to the brain’s reward and emotion systems.',f:'Studies link musical chills to dopamine release|Surprising harmonies or sudden volume changes often trigger them|Not everyone experiences them',k:'Dopamine|Expectation|Emotion',rel:'love'},
{id:'proc',t:'Why Do We Procrastinate?',s:'Psychology',c:'#3264FF',a:'#C7F464',m:'3 min',d:'It is less about time and more about feelings.',o:'Psychologists often describe procrastination as a way of avoiding uncomfortable emotions about a task, rather than poor time management.',f:'People tend to favour present rewards over future ones|Tasks that feel boring or scary are delayed most|Breaking work into small steps lowers the barrier to starting',k:'Present bias|Emotion regulation|Task aversion',rel:'mem'},
{id:'colour',t:'Why Do Certain Colours Grab Our Attention?',s:'Design',c:'#101014',a:'#7650E8',m:'3 min',d:'Contrast often matters more than the colour itself.',o:'Our eyes notice difference quickly. Strong contrast, saturated colour and learned meanings all pull attention in design.',f:'High contrast draws the eye faster than hue alone|Red is widely used for warnings, partly through learned association|Colour meanings vary between cultures',k:'Contrast|Saturation|Association',rel:'fonts'},
{id:'fonts',t:'How Do Fonts Change the Way We Feel?',s:'Design',c:'#F5F1E8',a:'#FF2D95',m:'3 min',d:'Typefaces carry tone before a single word is read.',o:'Letterforms shape how text feels: formal, friendly, urgent or calm. They also affect how easy something is to read.',f:'Some studies suggest hard-to-read fonts make tasks seem harder|Serif and sans-serif typefaces carry different associations|Font choice can change perceived tone and trust',k:'Typeface personality|Legibility|Hierarchy',rel:'colour'},
{id:'noise',t:'How Does Noise-Cancelling Actually Work?',s:'Everyday Science',c:'#3264FF',a:'#7650E8',m:'3 min',d:'It fights sound with more sound.',o:'Microphones pick up outside noise and the headphones play a sound wave that is its mirror image. The two waves cancel each other.',f:'The technique is called destructive interference|It works best on steady low-frequency sounds like engine hum|It needs power, unlike simple passive earplugs',k:'Destructive interference|Sound waves|Active control',rel:'sat'},

function fsx(r){const L=FS[r.id]||FS[CAT[r.id]]||[],c=['#FF2D95','#7650E8','#3264FF','#C7F464','#FF2D95'];return `<section class="dk"><div class="wrap" style="max-width:1000px"><span class="lbl">LIKED THIS?</span><h2 style="margin-top:0">Courses to study next</h2><p style="opacity:.85">If this question grabbed you, these are study areas to look for at school, college, university or online. They are general subjects, not specific programmes, so check what is offered near you.</p><div class="grid" style="margin-top:16px">${L.map((x,i)=>`<div class="ck" style="border-top:6px solid ${c[i%5]}"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div></section>`}
function render(){nav();const a=$('#app');a.innerHTML={home,course,collection,mixtapes,recap,profile:profPage,parent,about}[P]();
if(P==='course')explore(cur)}
document.addEventListener('click',e=>{const l=e.target.closest('a[href^="http"]');if(!l)return;e.preventDefault();let w=null;try{w=window.open(l.href,'_blank');if(w){w.opener=null;return}}catch(x){}try{navigator.clipboard.writeText(l.href)}catch(x){}toast('The preview blocked this link. Copy it into a new tab: '+esc(l.href),9000)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset,a=d.a;
if(a==='go')go(d.p);
else if(a==='open'){explore(d.id);go('course',d.id)}
else if(a==='filter'){filter=d.s;if(P!=='home'){P='home'}render()}
else if(a==='search'){qry=$('#q').value;render();$('#crate').scrollIntoView({behavior:'smooth'})}
else if(a==='surprise'){const o=R.filter(x=>x.id!==cur),r=o[Math.floor(Math.random()*o.length)];explore(r.id);go('course',r.id)}
else if(a==='togsave'){const i=S.saved.indexOf(d.id);if(i>-1)S.saved.splice(i,1);else S.saved.push(d.id);toast(i>-1?'Removed from collection':'Saved to collection');save();render()}
else if(a==='tab'){tab=d.t;render()}
else if(a==='addmix'){if(!S.mixes.length){toast('Create a mixtape first');go('mixtapes')}else{const m=S.mixes[S.mixes.length-1];if(m.r.includes(d.id))toast('Already in “'+m.n+'”');else{m.r.push(d.id);save();toast('Added to “'+m.n+'”')}}}
else if(a==='newmix'){const n=$('#mn').value.trim();if(!n){$('#mf').textContent='Please enter a name.';return}S.mixes.push({n,r:[]});save();render()}
else if(a==='addto'){const v=$('#ad'+d.m).value;if(v){S.mixes[d.m].r.push(v);save();render()}}
else if(a==='rm'){S.mixes[d.m].r.splice(+d.i,1);save();render()}
else if(a==='mv'){const r=S.mixes[d.m].r,i=+d.i,j=i+ +d.d;if(j>=0&&j<r.length){[r[i],r[j]]=[r[j],r[i]];save();render()}}
else if(a==='delmix'){S.mixes.splice(d.m,1);save();render()}
else if(a==='ck'){const i=+d.i;if(!S.lessons.includes(i))S.lessons.push(i);save();const y=scrollY;render();scrollTo(0,y)}
else if(a==='pick'){S.quiz.sel=+d.i;qr()}
else if(a==='submitq'){S.quiz.sub=true;S.quiz.ans[S.quiz.i]=S.quiz.sel;save();qr()}
else if(a==='nextq'){if(S.quiz.i<4){S.quiz.i++;S.quiz.sel=null;S.quiz.sub=false}else S.quiz.done=true;save();qr()}
else if(a==='retry'){S.quiz={i:0,ans:[],sub:false,sel:null,done:false};save();qr()}
else if(a==='review'){S.quiz.rev=!S.quiz.rev;qr()}
else if(a==='ask'){const t=$('#tx').value.trim(),f=$('#tf');if(!t){f.className='err';f.textContent=' Please type a question first.';return}
if(S.teacher.some(m=>m.x.toLowerCase()===t.toLowerCase())){f.className='err';f.textContent=' You already submitted that question.';return}
b.disabled=true;S.teacher.push({x:t,t:Date.now()});if(!save()){S.teacher.pop();f.className='err';f.textContent=' Could not save. Storage unavailable.';b.disabled=false;return}
$('#tm').innerHTML=teacher().match(/<div id="tm">([\s\S]*?)<\/div><textarea/)[1];$('#tx').value='';f.className='ok2';f.textContent=' ✓ Question saved. Awaiting a teacher.';b.disabled=false}
else if(a==='replay'){intro(true)}
else if(a==='fmt'){fmt=fmt===d.f?'All':d.f;rr()}
else if(a==='cat'){cat=d.c;rr()}
else if(a==='clear'){filter='All';cat='All';fmt='All';dif='All';qry='';rr()}
else if(a==='share'){S.share[d.k]=!S.share[d.k];save();rr()}
else if(a==='pm'){pm=d.m;rr()}
else if(a==='pcol'||a==='pfav'){dr.name=$('#pn').value;dr.bio=$('#pb').value;if(a==='pcol')dr.color=d.c;else{const k=dr.fav.indexOf(d.s);if(k>-1)dr.fav.splice(k,1);else dr.fav.push(d.s)}const y=scrollY;render();scrollTo(0,y)}
else if(a==='psave'){const n=$('#pn').value.trim(),f=$('#pf');if(!n){f.className='err';f.textContent=' Please enter a display name.';return}dr.name=n;dr.bio=$('#pb').value.trim();const old=S.profile;S.profile={...dr,fav:[...dr.fav],edited:true};if(save()){toast('Profile saved');const y=scrollY;render();scrollTo(0,y)}else{S.profile=old;f.className='err';f.textContent=' Could not save. Storage unavailable.'}}
else if(a==='rc'){ch+=+d.d;render()}});
function qr(){const z=$('.pink .wrap');const sec=[...document.querySelectorAll('section.pink')].find(s=>s.querySelector('h2')&&s.querySelector('h2').textContent==='Quiz');if(sec){sec.innerHTML='<h2>Quiz</h2>'+quiz()}}
document.addEventListener('change',e=>{if(e.target.id==='df'){dif=e.target.value;rr()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){qry=e.target.value;render();$('#crate').scrollIntoView({behavior:'smooth'})}});
function intro(force){let el=$('#intro'),seen=false;try{seen=sessionStorage.getItem('op_intro')==='1'}catch(e){}
if(seen&&!force){if(el)el.remove();return}
if(!el){el=document.createElement('div');el.id='intro';document.body.prepend(el)}
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;el.className=rm?'rm':'';el.style.opacity=1;
const col=['#FF2D95','#7650E8','#3264FF','#C7F464'],W=(t,c,pos,sz,dl,x)=>`<div class="wd" style="${pos};font-size:${sz};-webkit-text-stroke:2px ${c};animation-delay:${dl}s;--x:${x}">${t}</div>`,M=(t,dl,c)=>`<span class="m"><span class="wr" style="animation-delay:${dl}s;${c?'color:'+c:''}">${t}</span></span>`;
el.innerHTML=`<button class="btn o" style="color:#fff" id="sk">Skip intro</button>`+col.map((c,i)=>`<div class="ir" style="border-color:${c};border-width:${14-i*3}px;animation-delay:${.5+i*.25}s"></div>`).join('')+W('WHY?','#FF2D95','top:9%;left:5%','clamp(48px,13vw,170px)',.8,'-60vw')+W('WHAT IF?','#C7F464','top:21%;right:5%','clamp(40px,10vw,130px)',1.15,'60vw')+W('WHAT’S POSSIBLE?','#7650E8','bottom:12%;left:5%','clamp(30px,7.5vw,100px)',1.5,'-60vw')+`<div class="vn">${vinyl('#FF2D95','#7650E8','')}</div><div class="hd">${M('FOLLOW',2.6)} ${M('YOUR',2.85)}<br>${M('CURIOSITY.',3.1,'#C7F464')}</div><div class="wm2">OPEN <i>PRESS</i></div><div class="wp"></div>`;
let dn=0;const end=()=>{if(dn)return;dn=1;try{sessionStorage.setItem('op_intro','1')}catch(e){}el.style.transition='opacity .4s';el.style.opacity=0;setTimeout(()=>el.remove(),400)};$('#sk').onclick=end;setTimeout(end,rm?2500:4900)}
const h=location.hash.slice(1);if(['collection','mixtapes','recap','profile','parent','about'].includes(h))P=h;
render();intro();
</script></body></html>
